name: Mirror runtime images

on:
  workflow_dispatch:

concurrency:
  group: mirror-images
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Pull and push linux/amd64 images
        run: |
          set -euo pipefail
          mirror() {
            src="$1"
            dst="$2"
            docker pull --platform linux/amd64 "$src"
            docker tag "$src" "$dst"
            docker push "$dst"
          }
          mirror \
            "ghcr.io/immich-app/immich-machine-learning:release" \
            "registry.cn-hangzhou.aliyuncs.com/jiangker/immich-machine-learning:release"
          mirror \
            "docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf" \
            "registry.cn-hangzhou.aliyuncs.com/jiangker/valkey:9"
          mirror \
            "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23" \
            "registry.cn-hangzhou.aliyuncs.com/jiangker/immich-postgres:14-vectorchord0.4.3-pgvectors0.2.0"
