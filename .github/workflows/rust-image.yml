name: Build rust-server image

on:
  workflow_dispatch:
  push:
    branches: [dev-rust]
    paths:
      - "rust-server/**"
      - "server/**"
      - "web/**"
      - "i18n/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".pnpmfile.cjs"
      - ".dockerignore"
      - "LICENSE"
      - ".github/workflows/rust-image.yml"

concurrency:
  group: rust-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./rust-server/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha,scope=immich
          cache-to: type=gha,scope=immich,mode=max
          tags: |
            registry.cn-hangzhou.aliyuncs.com/jiangker/immich:latest
            registry.cn-hangzhou.aliyuncs.com/jiangker/immich:${{ github.sha }}
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=registry.cn-hangzhou.aliyuncs.com/jiangker/immich:${{ github.sha }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
