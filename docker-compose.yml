#
# Immich（dev-rust）单机部署。
# 镜像由 GitHub Actions 在推送 dev-rust 后编译并上传到阿里云，这台机器只拉取。
# Postgres、Redis、机器学习与 API 在同一份文件里启动，不要拆开。
#
#   cp rust-server/example.env .env
#   ./deploy
#
name: immich

services:
  immich-server:
    container_name: immich_server
    image: ${IMMICH_IMAGE:-registry.cn-hangzhou.aliyuncs.com/jiangker/immich:latest}
    command: ['rust-server']
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
      - ./packages/plugin-core:/build/plugins/immich-plugin-core:ro
    env_file:
      - .env
    environment:
      DB_HOSTNAME: database
      REDIS_HOSTNAME: redis
      IMMICH_MEDIA_LOCATION: /data
      IMMICH_SERVER_PATH: /usr/src/app/server
      IMMICH_WEB_ROOT: /build/www
      IMMICH_CORE_PLUGIN: /build/plugins/immich-plugin-core
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_ML_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
