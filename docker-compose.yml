#
# Immich（dev-rust）单机部署。不需要克隆仓库。
# 把本文件和 .env 放在同一目录，然后 docker compose up -d。
# 镜像由 GitHub Actions 推到阿里云，这台机器只拉取。
# 步骤见 rust-server/README.md。
#
name: immich

services:
  immich-server:
    container_name: immich_server
    image: ${IMMICH_IMAGE:-registry.cn-hangzhou.aliyuncs.com/jiangker/immich:latest}
    command: ['rust-server']
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      DB_HOSTNAME: database
      REDIS_HOSTNAME: redis
      IMMICH_MEDIA_LOCATION: /data
      IMMICH_SERVER_PATH: /usr/src/app/server
      IMMICH_WEB_ROOT: /build/www
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ${IMMICH_ML_IMAGE:-registry.cn-hangzhou.aliyuncs.com/jiangker/immich-machine-learning:release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: ${REDIS_IMAGE:-registry.cn-hangzhou.aliyuncs.com/jiangker/valkey:9}
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ${DB_IMAGE:-registry.cn-hangzhou.aliyuncs.com/jiangker/immich-postgres:14-vectorchord0.4.3-pgvectors0.2.0}
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
