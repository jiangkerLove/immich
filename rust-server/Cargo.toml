[package]
name = "rust-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["multipart"] }
axum-extra = "0.10.0"
tokio = { version = "1.43.0", features = ["full"] }
tower = "0.5.2"
serde = { version = "1.0.217", features = ["derive"] }
serde_with = "3.12.0"
validator = "0.20.0"
jsonwebtoken = "9.3.0"
# sqlx
sqlx = { version = "0.8.3", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono"] }

chrono = { version = "0.4.39", features = ["serde"] }
chrono-tz = "0.10.4"
image = { version = "0.25.5", features = ["jpeg", "webp", "png", "gif"] }
thumbhash = "0.1"
ffmpeg-cli = "0.1.0"
ammonia = "4.0.0"
ua-parser = "0.2.0"
uuid = { version = "1.12.1", features = ["serde", "v4", "v7"] }
mime = "0.3.17"
serde_json = { version = "1.0.137", features = ["raw_value"] }

# .env
dotenv = "0.15"
config = "0.15.6"

#redis
bb8 = "0.9.0"
redis = { version = "1", default-features = false, features = ["tokio-comp", "bb8"] }
async-trait = "0.1.85"
thiserror = "2.0.11"

#bcrypt
bcrypt = "0.16.0"

#crypto
rand = "0.8.5"
base64 = "0.22.1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4.3"

# http / oauth / files
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
openidconnect = { version = "3.5", default-features = false, features = ["reqwest", "rustls-tls"] }
mime_guess = "2.0.5"
urlencoding = "2.1.3"
url = "2.5"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
zip = "2.2"
tempfile = "3"
flate2 = "1.0"
rsa = { version = "0.9", features = ["sha2"] }

#user_agent_parser
user-agent-parser = "0.3.6"
bullmq-rs = "2.2.0"
handlebars = "6.2.0"
socketioxide = { version = "0.18.4", features = ["extensions", "state"] }
socketioxide-redis = "0.4.1"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
